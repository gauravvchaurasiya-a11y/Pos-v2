<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer orders - Owner</title>
<style>
:root{--bg:#111216;--s1:#1a1b21;--s2:#23242b;--line:#2a2b33;--text:#f2f2f4;--muted:#9c9da7;--coral:#ef4f5f;--green:#2fbf71;--orange:#f5a524;--r:16px}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(17,18,22,.95);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;font-weight:800}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.packed{opacity:.75}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nm{font-weight:800;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.badge.new{background:#33270e;color:var(--orange)}
.badge.packed{background:#18213b;color:#6b93ff}
.badge.done{background:#143022;color:var(--green)}
.items{margin:10px 0;font-size:14px}
.items div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.tot{font-weight:800;font-size:16px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--s2);color:var(--text)}
.btn.p{background:var(--coral);color:#fff}
.btn.g{background:var(--green);color:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.f{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--text);font:inherit}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.signin{max-width:380px;margin:60px auto;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.err{color:var(--coral);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Customer orders</h1><button class="btn" id="out" hidden>Sign out</button></header>
<div class="signin" id="signin">
<h2 style="font-size:17px;margin-bottom:6px">Owner sign-in</h2>
<p class="meta">Use the POS admin sign-in. Customer orders are visible only to the owner.</p>
<label>Email</label><input class="f" id="em" type="email" autocomplete="email">
<label>Password</label><input class="f" id="pw" type="password" autocomplete="current-password">
<div class="row" style="margin-top:14px">
<button class="btn" id="google">Google sign-in</button>
<button class="btn p" id="go">Sign in</button>
</div>
<div class="err" id="authErr"></div>
</div>
<div class="wrap" id="list" hidden></div>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
const CFG={apiKey:'AIzaSyDtplfGP-AmlVzSzu5Lzxjztnc6MB34Fq4',authDomain:'shree-festival-pos.firebaseapp.com',projectId:'shree-festival-pos',appId:'1:552632077785:web:68453eff10fff605401dc8'};
const OWNER='77PHL79szXWqP5VaD8X1YovPujp2',ROOT='livePos/test';
const app=firebase.initializeApp(CFG,'owner-orders'),auth=app.auth(),db=app.firestore();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=p=>'₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:2});
$('#google').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('#authErr').textContent=e.message);
$('#go').onclick=()=>auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(e=>$('#authErr').textContent=e.message);
$('#out').onclick=()=>auth.signOut();
let stop=null;
auth.onAuthStateChanged(u=>{
 const ok=u&&u.uid===OWNER;
 $('#signin').hidden=!!ok;$('#list').hidden=!ok;$('#out').hidden=!ok;
 if(stop){stop();stop=null}
 if(ok)start();
});
function start(){
 stop=db.collection(ROOT+'/customerOrders').orderBy('createdAt','desc').limit(100)
 .onSnapshot(snap=>{
  const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
  $('#list').innerHTML=docs.length?docs.map(o=>{
   const when=o.createdAt?new Date(o.createdAt.toMillis()).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'just now';
   return `<div class="card ${o.status==='done'?'packed':''}">
    <div class="row"><span class="nm">#${esc(o.id.slice(-6).toUpperCase())} · ${esc(o.name)}</span><span class="badge ${esc(o.status)}">${esc(o.status.toUpperCase())}</span></div>
    <div class="meta">${when} · ${esc(o.phone)}</div>
    ${o.address?`<div class="meta">Address: ${esc(o.address)}</div>`:''}
    ${o.note?`<div class="meta">Note: ${esc(o.note)}</div>`:''}
    <div class="items">${(o.items||[]).map(i=>`<div><span>${esc(i.name)}</span><span>× ${i.qty} · ${money(i.pricePaise*i.qty)}</span></div>`).join('')}</div>
    <div class="row"><span class="tot">Total ${money(o.totalPaise||0)}</span>
    <span>${o.status!=='done'?`<button class="btn g" onclick="setStatus('${o.id}','done')">Mark done</button>`:''}
    <button class="btn" onclick="del('${o.id}')">Delete</button></span></div>
   </div>`;
  }).join(''):'<div class="empty">No customer orders yet.</div>';
 },err=>{$('#list').innerHTML='<div class="empty">Could not load orders: '+esc(err.message)+'</div>'});
}
window.setStatus=async(id,s)=>{try{await db.doc(ROOT+'/customerOrders/'+id).update({status:s})}catch(e){alert(e.message)}};
window.del=async(id)=>{if(!confirm('Delete this order?'))return;try{await db.doc(ROOT+'/customerOrders/'+id).delete()}catch(e){alert(e.message)}};
</script>
</body>
</html>
