<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wholesale POS & Billing</title>
<style>
:root{--bg:#f1f3f5;--nav:#1f2428;--nav2:#2b3137;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--green:#16a34a;--green2:#dcfce7;--orange:#f97316;--orange2:#ffedd5;--red:#dc2626;--red2:#fee2e2;--blue:#2563eb;--blue2:#dbeafe;--r:12px;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
h1,h2,h3,h4{margin:0 0 8px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff;outline:none;transition:border.15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
input:disabled{background:#f3f4f6;color:var(--muted)}
input[type=checkbox]{width:auto;margin:0}
label{display:block;font-size:12px;font-weight:600;color:#4b5563;margin:10px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid#d1d5db;background:#fff;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s}
.btn:hover{background:#f9fafb;border-color:#9ca3af}.btn:disabled{opacity:.45;cursor:not-allowed}

.btn.primary{background:var(--nav);border-color:var(--nav);color:#fff}.btn.primary:hover{background:#000}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.green:hover{background:#15803d}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost-red{color:var(--red);border-color:#fecaca}.btn.ghost-red:hover{background:var(--red2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}.btn.lg{padding:12px 18px;font-size:16px}.btn.block{width:100%}
.muted{color:var(--muted)}.sm{font-size:12px}.c{text-align:center}.r{text-align:right}.mt{margin-top:14px}.mb{margin-bottom:14px}
.green-t{color:var(--green)}.orange-t{color:var(--orange)}.red-t{color:var(--red)}.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}.pad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:150px}.toolbar .grow{flex:1;min-width:220px}.toolbarlabel{margin:0}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green2);color:#166534}.b-orange{background:var(--orange2);color:#9a3412}.b-red{background:var(--red2);color:#991b1b}.b-grey{background:#f3f4f6;color:#4b5563}.b-blue{background:var(--blue2);color:#1e40af}

.tbl-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#f9fafb;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:hover td{background:#fafafa}.tbl tfoot td{font-weight:700;background:#f9fafb}.tbl .r{text-align:right}
.tbl input,.tbl select{padding:6px 8px;min-width:80px}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;display:flex}
.tile{align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f2428,#3f4a55);padding:20px}
.login-card{background:#fff;border-radius:18px;padding:28px;width:410px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.lg-brand h2{font-size:18px;margin:0}
.logo-mark{width:48px;height:48px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex-shrink:0}
.seg{display:inline-flex;background:#f3f4f6;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px
rgba(0,0,0,.12)}.seg.full{display:flex}.seg.full button{flex:1}
#app{display:flex;height:100vh}
.side{width:224px;background:var(--nav);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.side .brand{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #343b42}
.side .brand .logo-mark{width:38px;height:38px;font-size:18px}.side .brand b{color:#fff;display:block;font-size:14px;line-height:1.2}
.side nav{flex:1;padding:10px;overflow:auto}
.side nav a .ic svg{width:18px;height:18px;display:block;flex-shrink:0}
.side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:#cbd5e1;margin-bottom:2px;font-weight:500}
.side nav a:hover{background:var(--nav2);color:#fff}.side nav a.on{background:#fff;color:var(--nav);font-weight:700}
.side .ic{width:22px;text-align:center}.side .foot{padding:10px;border-top:1px solid#343b42}.side .foot nav{padding:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px;flex-shrink:0}
.top h2{margin:0;font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:#f3f4f6;font-size:12px;font-weight:600}
.chip.warn{background:var(--orange2);color:#9a3412;cursor:pointer}
#view{flex:1;overflow:auto;padding:20px}
#view.posmode{padding:12px;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-bottom:18px}

.stat{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;border-left:4px solid var(--nav)}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:21px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.stat.g{border-color:var(--green)}.stat.o{border-color:var(--orange)}.stat.b{border-color:var(--blue)}.stat.r{border-color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}.sec-hh3{margin:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);gap:3px}
.bar i{display:block;width:100%;max-width:46px;background:linear-gradient(180deg,#22c55e,#16a34a);border-radius:6px 6px 2px 2px;min-height:2px}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px;height:100%}
.pos-left{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px}
.pos-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pos-tools input{width:auto}
#posSearch{flex:2;min-width:200px}#skuInput{flex:1;min-width:170px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;flex-shrink:0}
.chips button{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.chips button.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.chips.sub button{font-size:12px;padding:5px 11px}.chips.sub button.on{background:var(--blue);border-color:var(--blue)}
.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;align-content:start;padding:8px 2px 4px;grid-auto-rows:max-content}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;
display:flex;flex-direction:column;transition:.15s;user-select:none}
.pcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#cbd5e1}.pcard.out{opacity:.55}
.pimg{height:92px;background:#f3f4f6;display:flex}.pimg img{width:100%;height:100%;object-fit:cover}
.pimg span{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800}
.pinfo{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pname{font-weight:700;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.psku{font-size:11px;color:var(--muted)}.prow{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.price{font-size:15px}.addb{margin-top:6px;width:100%}
.pos-right{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.cust-name{font-weight:700;font-size:15px}
.cart-items{flex:1;overflow:auto;padding:4px 10px}
.cline{border-bottom:1px dashed var(--line);padding:8px 4px}
.cl-top{display:flex;justify-content:space-between;gap:6px}.cl-name{font-weight:700}

.cl-bot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.qty{display:flex;align-items:center;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}
.qty button{border:0;background:#f3f4f6;width:32px;height:32px;cursor:pointer;font-size:16px;font-weight:700}
.qty input{width:64px;border:0;border-radius:0;text-align:center;padding:6px 2px;box-shadow:none!important}
.x{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:#9ca3af;padding:2px 7px;border-radius:6px}
.x:hover{background:var(--red2);color:var(--red)}.lnk{color:var(--blue);cursor:pointer;font-weight:600}
.cart-f{border-top:1px solid var(--line);padding:10px 14px;background:#fafafa}
.od{display:flex;gap:6px;align-items:center}.od label{margin:0;white-space:nowrap}.od select{width:64px}.od input{flex:1}
.totals{margin-top:8px;font-size:13px}.totals div{display:flex;justify-content:space-between;padding:2px 0}
.grand{display:flex;justify-content:space-between;align-items:center;background:var(--nav);color:#fff;padding:10px 14px;border-radius:10px;margin:8px 0}
.grand b{font-size:22px;font-variant-numeric:tabular-nums}
.cart-btns{display:grid;grid-template-columns:auto 1fr;gap:8px}.kbd{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.flash{animation:fl .6s}@keyframes fl{from{background:#bbf7d0}to{background:transparent}}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:580px;max-width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:tin .15s}.modal.wide{width:1000px}

.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:16px 18px}.modal-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:#fafafa;border-radius:0 0 14px 14px}
.paym{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.paym button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:13px}
.paym button.on{border-color:var(--green);background:var(--green2);color:#166534}
.ck-sum{background:#f9fafb;border-radius:10px;padding:10px 14px;margin-bottom:6px}.ck-sum div{display:flex;justify-content:space-between;padding:2px 0}
.ck-sum .g{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.ck-info{margin-top:12px}.ok{background:var(--green2);color:#166534;padding:10px 12px;border-radius:8px;font-weight:600}
.warn{background:var(--orange2);color:#9a3412;padding:10px 12px;border-radius:8px;font-weight:600}
.cu-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.cu-item{padding:9px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}.cu-item:hover{background:#f0fdf4}
.inv-prev{background:#e5e7eb;padding:16px;border-radius:10px;overflow:auto;max-height:62vh}.inv-prev .inv{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pf{display:grid;grid-template-columns:200px 1fr;gap:18px}
.imgbox{width:200px;height:200px;border-radius:12px;background:#f3f4f6;border:2px dashed#d1d5db;display:flex;overflow:hidden;margin-bottom:8px;flex-shrink:0}
.imgbox img{width:100%;height:100%;object-fit:contain;background:#fff}

.tree .node{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--nav)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;
flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--nav);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px;font-weight:600;animation:tin .2s}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--orange)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#printArea{display:none}
@media print{body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block!important}}
@media (max-width:1150px){.pos{grid-template-columns:minmax(0,1fr) 360px}}
@media (max-width:960px){.side{width:64px}.side nav a .t,.side .brand div{display:none}.side nav a{justify-content:center}.cols{grid-template-columns:1fr}}
@media (max-width:820px){.pos{grid-template-columns:minmax(0,1fr);height:auto}
#view.posmode{overflow:auto}.pgrid{max-height:60vh}.pos-right{min-height:480px}.grid2,.pf{grid-template-columns:1fr}.paym{grid-template-columns:1fr 1fr}}
</style>
<style id="invStyle"></style>
<style id="pageStyle"></style>

<style id="uiV2">

html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:Inter,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#33343d;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

input::placeholder,textarea::placeholder{color:#6f707b}

input:disabled{background:var(--s1);color:var(--muted)}
label{color:var(--muted)}
.btn{background:var(--s2);border-color:var(--line);color:var(--text);border-radius:10px}
.btn:hover{background:var(--s3);border-color:#3b3c46}

.btn.primary:hover,.btn.green:hover{background:#dc3e4e;border-color:#dc3e4e}
.btn.orange{color:#1b1306}
.btn.ghost-red{background:transparent;color:var(--coral);border-color:var(--coral-b)}.btn.ghost-red:hover{background:var(--coral-d)}
.card,.tbl-wrap,.modal,.login-card{background:var(--s1);box-shadow:none;border:1px solid var(--line)}
.stat,.stat.g,.stat.o,.stat.b,.stat.r{background:var(--s1);box-shadow:none;border:1px solid var(--line);border-left:3px solid var(--s3);border-radius:14px}
.stat.g{border-left-color:var(--green)}.stat.o{border-left-color:var(--orange)}.stat.b{border-left-color:var(--blue)}.stat.r{border-left-color:var(--coral)}
.tbl th{background:var(--s2);color:var(--muted);border-color:var(--line)}
.tbl td{border-color:var(--line)}.tbl tr:hover td{background:#1f2026}.tbl tfoot td{background:var(--s2)}
.b-green{background:var(--green2);color:#6ee7a8}.b-orange{background:var(--orange2);color:#fcc04d}.b-red{background:var(--red2);color:#ff8f99}.b-grey{background:var(--s3);color:var(--muted)}.b-blue{background:var(--blue2);color:#a3bcff}
.green-t{color:#4ade80}.orange-t{color:#fcc04d}.red-t{color:#ff6b78}
.ok{background:var(--green2);color:#6ee7a8}.warn{background:var(--orange2);color:#fcc04d}
.login{background:radial-gradient(900px 500px at 50% -10%,#3a1519,#111216 70%)}
.logo-mark{background:var(--coral)}
.seg{background:var(--s2)}.seg button{color:var(--muted)}.seg button.on{background:var(--s3);color:var(--text);box-shadow:none}
.side{background:var(--nav);color:var(--muted);border-right:1px solid var(--line)}
.side .brand,.side .foot{border-color:var(--line)}
.side nav a{color:var(--muted)}.side nav a:hover{background:var(--s1);color:var(--text)}.side nav a.on{background:var(--coral-d);color:var(--coral)}
.top{background:var(--bg);border-color:var(--line)}
.chip{background:var(--s2);color:var(--text)}.chip.warn{background:var(--orange2);color:#fcc04d}
.bar i{background:linear-gradient(180deg,#ff7d88,var(--coral))}
.chips{gap:8px}.chips button{background:var(--s1);border-color:var(--line);color:var(--text);border-radius:12px;padding:8px 14px}

.chips.sub button.on{background:var(--s3);border-color:#4a4b57;color:#fff}
.tabs{border-color:var(--line)}.tabs button.on{border-color:var(--coral)}
.tree .node,.cline,.cart-h,.modal-h,.cu-item{border-color:var(--line)}
.cart-f,.modal-f,.ck-sum{background:var(--s2);border-color:var(--line)}
.grand{background:var(--coral);border-radius:12px}
.qty{border-color:var(--coral-b);border-radius:10px}.qty button{background:var(--coral-d);color:var(--coral)}.qty input{background:var(--coral-d);color:var(--text)}
.x{color:var(--muted)}.x:hover{background:var(--coral-d);color:var(--coral)}.lnk{color:var(--coral)}
.modal-bg{background:rgba(0,0,0,.68);backdrop-filter:blur(2px)}.modal{border-radius:18px}.modal-f{border-radius:0 0 18px 18px}
.paym button{background:var(--s2);border-color:var(--line);color:var(--text)}.paym button.on{border-color:var(--coral);background:var(--coral-d);color:#fff}
.cu-list{border-color:var(--line)}.cu-item:hover{background:var(--s2)}
.inv-prev{background:#26272e}
.imgbox{background:var(--s2);border-color:var(--s3)}.imgbox img{background:var(--s2)}

.kbd,.empty{color:var(--muted)}

/* POS list */

,p.qty,r2(p.amt),p.bills]));download(`top-products-${repF.from}-to-${repF.to}.csv`,csv(rows),'text/csv;charset=utf-8')}/* ================= SETTINGS & BACKUP ================= */function maxUsedSeq(prefix){let mx=0;S.sales.forEach(s=>{if(s.invNo.startsWith(prefix)){const n=parseInt(s.invNo.slice(prefix.length),10);if(isFinite(n)&&n>mx)mx=n}});return mx}function vSettings(v){const st=S.settings;let logo=st.logo;const prev=localStorage.getItem(PREV);let prevInfo='';try{if(prev)prevInfo=fmtDT(JSON.parse(prev).date)}catch(e){}const used=(((localStorage.getItem(KEY)||'').length+(prev||'').length)*2/1024);  v.innerHTML=`<div class="cols"><div class="card pad"><h3>Business Details</h3><div class="row" style="align-items:flex-start"><div class="imgbox" id="sLogoBox" style="width:110px;height:110px"></div><div><input type="file" id="sLogoF" accept="image/*" hidden><button class="btn sm" onclick="$('#sLogoF').click()">Upload logo</button> <button class="btn sm ghost-red" id="sLogoRm">Remove</button><p class="muted sm">Printed on invoices.</p></div></div>  <label>Business name *</label><input id="sBiz" value="${esc(st.bizName)}"><label>Tagline</label><input id="sTag" value="${esc(st.tagline)}"><label>Address</label><textarea id="sAddr" rows="2">${esc(st.address)}</textarea><div class="grid2"><div><label>Phone</label><input id="sPhone" value="${esc(st.phone)}"></div><div><label>Email</label><input id="sEmail" value="${esc(st.email)}"></div></div><label>Business GSTIN</label><input id="sGstin" value="${esc(st.gstin)}" style="text-transform:uppercase"><label>Bank / UPI details (printed on invoice)</label><textarea id="sBank" rows="2">${esc(st.bank)}</textarea><label>Invoice terms &amp; conditions</label><textarea id="sTerms" rows="2">${esc(st.terms)}</textarea></div>  <div class="card pad"><h3>Billing &amp; Tax</h3><label class="row"><input type="checkbox" id="sGstOn" ${st.gstEnabled?'checked':''}> Charge GST on sales</label><div class="grid2"><div><label>Default GST % for new products</label><input id="sGstRate" type="number" min="0" max="100" step="0.01" value="${st.gstRate}"></div><div><label>Show GST as</label><select id="sTaxMode"><option value="split">CGST + SGST (intra-state)</option><option value="igst" ${st.taxMode==='igst'?'selected':''}>IGST (inter-state)</option></select></div></div><label class="row"><input type="checkbox" id="sRound" ${st.roundOff?'checked':''}> Round grand total to nearest rupee</label>  <div class="grid2"><div><label>Default low-stock alert level</label><input id="sLow" type="number" min="0" step="1" value="${st.lowStock}"></div><div></div><div><label>Invoice prefix</label><input id="sPrefix" value="${esc(st.invPrefix)}"></div><div><label>Next invoice number</label><input id="sSeq" type="number" min="1" step="1" value="${st.invSeq}"></div></div><p class="muted sm">Next invoice will be <b>${esc(st.invPrefix+String(st.invSeq).padStart(5,'0'))}</b></p>  <h3 class="mt">Security</h3><div class="grid2"><div><label>New admin password</label><input id="sPass" type="password" placeholder="Leave blank to keep current"></div><div><label>Confirm new password</label><input id="sPass2" type="password"></div></div><label>Cashier PIN (4–8 digits; blank = no PIN)</label><input id="sPin" type="password" inputmode="numeric" value="${esc(st.cashierPin)}"></div></div>  <div class="row mt"><button class="btn green lg" id="stSave">💾 Save Settings</button></div>  <div class="card pad mt"><h3>Data, Backup &amp; Restore</h3><p class="muted sm">All data lives in this browser on this computer. Export a backup every day and keep a copy on a USB drive. Storage used: about ${used.toFixed(0)} KB (Chrome allows roughly 5,000 KB). ${st.lastBackup?'Last backup: <b>'+fmtDT(st.lastBackup)+'</b>':'<b class="orange-t">No backup exported yet.</b>'}</p>  <div class="row"><button class="btn primary" onclick="exportBackup()">⬇ Export Full Backup (JSON)</button><input type="file" id="impF" aria-label="Choose JSON backup to import" accept=".json,application/json"><button class="btn" onclick="$('#impF').click()">⬆ Import / Restore Backup</button><button class="btn" onclick="restorePrevious()" ${prev?'':'disabled'}>↺ Restore Previous Data${prevInfo?' ('+prevInfo+')':''}</button><button class="btn" onclick="exportSalesCSV()">⬇ All Sales CSV</button><button class="btn" onclick="exportProducts()">⬇ Products CSV</button><button class="btn ghost-red" onclick="resetData()">Erase All Data</button></div></div>${typeof syncCardHTML==='function'?syncCardHTML():''}`;  const drawLogo=()=>{$('#sLogoBox').innerHTML=logo?`<img src="${logo}" alt="">`:'<span class="muted sm" style="margin:auto">No logo</span>'};drawLogo();  $('#sLogoF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{logo=await resizeImage(f,300);drawLogo()}catch(err){toast('Could not read this image','err')}e.target.value=''};  $('#sLogoRm').onclick=()=>{logo='';drawLogo()};  $('#stSave').onclick=()=>saveSettings(logo);  $('#impF').onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=''}}async function saveSettings(logo){if(!adminOnly())return;const g=id=>$(id).value;const n={bizName:g('#sBiz').trim(),tagline:g('#sTag').trim(),address:g('#sAddr').trim(),phone:g('#sPhone').trim(),email:g('#sEmail').trim(),gstin:g('#sGstin').trim().toUpperCase(),bank:g('#sBank').trim(),terms:g('#sTerms').trim(),gstEnabled:$('#sGstOn').checked,gstRate:num(g('#sGstRate')),taxMode:g('#sTaxMode'),roundOff:$('#sRound').checked,lowStock:Number(g('#sLow')),invPrefix:g('#sPrefix').trim(),invSeq:Number(g('#sSeq')),logo};  if(!n.bizName)return toast('Business name is required','err');  if(n.gstin&&!/^[0-9A-Z]{15}$/.test(n.gstin))return toast('Business GSTIN must be 15 letters/digits','err');  if(n.gstRate<0||n.gstRate>100)return toast('GST rate must be 0–100','err');  if(!Number.isInteger(n.lowStock)||n.lowStock<0)return toast('Low-stock level must be a whole number','err');  if(!n.invPrefix||n.invPrefix.length>10)return toast('Invoice prefix must be 1–10 characters','err');  const mx=maxUsedSeq(n.invPrefix);if(!Number.isInteger(n.invSeq)||n.invSeq<1)return toast('Next invoice number must be a whole number','err');  if(n.invSeq<=mx)return toast(`Next invoice number must be greater than ${mx} (already used)`,'err');  const np=g('#sPass'),np2=g('#sPass2');if(np||np2){if(np.length<4)return toast('Admin password must be at least 4 characters','err');if(np!==np2)return toast('Passwords do not match','err');n.adminPass=np}  const pin=g('#sPin').trim();if(pin&&!/^\d{4,8}$/.test(pin))return toast('Cashier PIN must be 4–8 digits','err');n.cashierPin=pin;  Object.assign(S.settings,n);if(await save()){toast('Settings saved');renderNav();render()}}async function exportBackup(){S.settings.lastBackup=new Date().toISOString();await save();const d=new Date();const name=`pos-backup-${today()}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;download(name,JSON.stringify({app:'Offline Wholesale POS',version:1,exported:S.settings.lastBackup,data:S}),'application/json');toast('Backup downloaded — keep it safe');if(page==='settings')render()}function snapshotCurrent(){try{localStorage.setItem(PREV,JSON.stringify({date:new Date().toISOString(),data:S}));return true}catch(e){toast('Could not keep an undo snapshot (storage full)','warn');return false}}function importBackup(file){
 if(!adminOnly())return;
 const fr=new FileReader();
 fr.onload=()=>{try{
  const d=JSON.parse(fr.result),data=d&&d.data?d.data:d;
  if(!data||!Array.isArray(data.products)||!Array.isArray(data.sales)||!data.settings)throw new Error('This is not a valid POS backup file.');
  const m=openModal('Review backup import',`<p>Products: <b>${data.products.length}</b><br>Sales: <b>${data.sales.length}</b><br>Photos: <b>${data.products.filter(p=>p.image).length}</b></p><p>This replaces data in this browser only. A restore point is kept. Nothing uploads until you choose Upload.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" id="confirmBackupImport">Import backup into this browser</button>`);
  m.querySelector('#confirmBackupImport').onclick=async ()=>{
   if(!snapshotCurrent())return;
   S=data;normalize();
   if(await save()){cart=newCart();saveCart();closeAll();toast('Backup restored successfully');renderNav();render()}
  };
 }catch(e){toast('Import failed: '+e.message,'err')}};
 fr.onerror=()=>toast('Could not read the file','err');fr.readAsText(file);
}
async function restorePrevious(){if(!adminOnly())return;let p=null;try{p=JSON.parse(localStorage.getItem(PREV))}catch(e){}if(!p||!p.data)return toast('No previous snapshot available','err');  if(!confirm(`Restore the data snapshot taken on ${fmtDT(p.date)}?\n\nYour current data will be kept as the new snapshot, so you can switch back.`))return;  const cur=S;S=p.data;normalize();try{localStorage.setItem(PREV,JSON.stringify({date:new Date().toISOString(),data:cur}))}catch(e){}  if(await save()){cart=newCart();saveCart();toast('Previous data restored');renderNav();render()}}async function resetData(){if(!adminOnly())return;if(prompt('This erases ALL products, categories, customers, sales and stock history.\nBusiness settings and passwords are kept.\n\nType RESET to confirm:')!=='RESET')return toast('Erase cancelled','warn');  snapshotCurrent();const st=S.settings;S={version:1,settings:Object.assign({},st,{invSeq:1}),categories:[],products:[],customers:[],sales:[],movements:[]};normalize();cart=newCart();saveCart();  if(await save()){toast('All data erased. Undo with "Restore Previous Data".','warn');render()}}/* ================= KEYBOARD & STARTUP ================= */document.addEventListener('keydown',e=>{if(!role)return;const modalOpen=$('#modals').children.length>0;  if(e.key==='Escape'&&modalOpen){e.preventDefault();closeModal();return}  if(page!=='pos'||modalOpen)return;  if(e.key==='F2'){e.preventDefault();const s=$('#posSearch');s.focus();s.select()}  else if(e.key==='F3'){e.preventDefault();$('#skuInput').focus()}  else if(e.key==='F4'){e.preventDefault();chooseCustomer()}  else if(e.key==='F8'){e.preventDefault();clearCart()}  else if(e.key==='F9'){e.preventDefault();openCheckout()}});window.addEventListener('storage',e=>{if(!role)return;if(e.key===KEY){load();render()}else if(e.key===CARTKEY){cart=loadCart();if(page==='pos')renderCart()}});window.addEventListener('beforeprint',()=>{if(!$('#printArea').innerHTML)$('#pageStyle').textContent=''});window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});$('#invStyle').textContent=INV_CSS;load();cart=loadCart();$('#app').hidden=true;$('#login').hidden=false;$('#lgBiz').textContent='Connecting to live shop...';</script>
